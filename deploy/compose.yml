# Plain Docker Compose for any VPS (docs/SELF-HOSTING.md). Coolify does not use this file: it builds the Dockerfile
# itself. This is the host-agnostic fallback and the "move to another host" path.
#
#   cp .env.example deploy/.env   # fill in the values, plus DOMAIN=<your hostname>; never commit it
#   docker compose -f deploy/compose.yml up -d --build                 # app only, on 127.0.0.1:8787
#   docker compose -f deploy/compose.yml --profile tls up -d --build   # + Caddy, HTTPS for $DOMAIN
#
# Everything is configured through deploy/.env: no host-specific settings in the code path. Compose also reads
# that file to fill in ${DOMAIN} below, and checks it on every command (ps, logs, down too), so keep DOMAIN there.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Runs the 15-minute jobs (collect, backfill, extremes, lab, intel) in this process instead of Supabase pg_cron.
      # Turn the database schedule off first: db/cron/unschedule.sql.
      CRON_IN_PROCESS: ${CRON_IN_PROCESS:-1}
    restart: unless-stopped
    # Loopback only: Caddy (profile tls) or your own proxy fronts it.
    ports:
      - "127.0.0.1:8787:8787" # leave PORT unset in .env: the app listens on 8787 inside the container
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname whose DNS A record points at this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
