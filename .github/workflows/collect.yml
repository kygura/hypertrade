name: Collect Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          [ -n "$CRON_TOKEN" ] || missing="$missing CRON_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — set them under Settings > Secrets and variables > Actions. APP_URL is the deployed origin (e.g. https://hypertrade.vercel.app, no trailing slash); CRON_TOKEN must match the app's CRON_TOKEN env var."
            exit 1
          fi

      - name: Collect data
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -o pipefail
          url="${APP_URL%/}/api/cron/collect"
          body=$(mktemp)
          # --fail-with-body: HTTP errors become a non-zero exit (so --retry sees
          # them as transient) while still writing the response body for logs.
          code=$(curl -sS -X POST \
            --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            -H "x-cron-token: $CRON_TOKEN" \
            -o "$body" -w '%{http_code}' \
            "$url") && status=0 || status=$?
          echo "POST $url -> HTTP ${code:-none}"
          cat "$body"
          echo
          if [ "$status" -ne 0 ]; then
            echo "::error::Collection failed (curl exit $status, HTTP ${code:-none})"
            exit 1
          fi

      # Keeps chart history warm for core, branch and recently charted coins:
      # daily history, a head sync of every timeframe (Hyperliquid only serves
      # the latest 5000 bars, so this is what lets 1m-15m history accumulate),
      # and funding pages. Deadline-bounded server side (170s); coins it
      # doesn't reach go first-served on the next run. No curl retries: a
      # timed-out run keeps going on Vercel, so a retry overlaps it and the two
      # contend for the same candle rows. The next scheduled run picks it up.
      - name: Backfill candles
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -o pipefail
          url="${APP_URL%/}/api/cron/backfill"
          body=$(mktemp)
          code=$(curl -sS -X POST \
            --fail-with-body \
            --max-time 280 \
            -H "x-cron-token: $CRON_TOKEN" \
            -o "$body" -w '%{http_code}' \
            "$url") && status=0 || status=$?
          echo "POST $url -> HTTP ${code:-none}"
          cat "$body"
          echo
          if [ "$status" -ne 0 ]; then
            echo "::error::Backfill failed (curl exit $status, HTTP ${code:-none})"
            exit 1
          fi
