name: Collect Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect data
        run: |
          curl -fsS -X POST \
            -H "x-cron-token: ${{ secrets.CRON_TOKEN }}" \
            "${{ secrets.APP_URL }}/api/cron/collect"
