name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: No focused tests
        run: "! grep -rn '\\.only(' src --include=*.test.ts --include=*.test.tsx"
      - run: bun run typecheck
      - run: bun test src
      - run: bun run build
      - run: bun run check:api
