name: Routine (fallback)

# Provider-agnostic setups pulse and daily brief (docs/fallback-routine.md).
# Claude Opus 5.5 by default, Kimi when the Anthropic call fails; ROUTINE_LLM overrides.
# pulse: every 4 h, writes data/setups/ (no redeploy: vercel.json ignoreCommand).
# daily: 06:40 UTC, only when the repository variable ROUTINE_FALLBACK is
# 'true'; writes MarketState, Sectors and the Lab snapshot too.
# Without an LLM key the run prints a notice and exits 0.

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pulse | daily | htf"
        type: choice
        options: [pulse, daily, htf]
        default: pulse
      dry_run:
        description: "Collect, call the model, print the brief; write and send nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: routine
  cancel-in-progress: false

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY: ${{ inputs.dry_run }}
          FALLBACK: ${{ vars.ROUTINE_FALLBACK }}
        run: |
          dry=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
            [ "$INPUT_DRY" = "true" ] && dry=true
          elif [ "$SCHEDULE" = "40 6 * * *" ]; then
            if [ "$FALLBACK" = "true" ]; then mode=daily; else mode=skip; echo "daily fallback disabled (repository variable ROUTINE_FALLBACK is not 'true')"; fi
          else
            mode=pulse
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "mode=$mode dry_run=$dry"

      - name: Run routine
        id: run
        if: steps.mode.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRY: ${{ steps.mode.outputs.dry }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          LAB_API_TOKEN: ${{ secrets.LAB_API_TOKEN }}
          ROUTINE_LLM: ${{ vars.ROUTINE_LLM }}
          ROUTINE_MAX_USD: ${{ vars.ROUTINE_MAX_USD }}
        run: |
          if [ "$DRY" = "true" ]; then bun run routine --mode "$MODE" --dry-run; else bun run routine --mode "$MODE"; fi

      # Runs even when the routine exited non-zero: a model failure still leaves
      # code-decided setup status changes worth keeping. Only data/ is staged.
      # A daily commit must pass typecheck + tests to reach master; otherwise it
      # goes to routine/<date> (no deploy there) and the job fails after the push,
      # so nothing computed is lost and master never goes red from a data commit.
      - name: Commit and push data
        if: ${{ !cancelled() && steps.mode.outputs.mode != 'skip' && steps.mode.outputs.dry != 'true' }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_DATE: ${{ steps.run.outputs.run_date }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "no data changes"
            exit 0
          fi
          checks_ok=true
          if [ "$MODE" = "daily" ] && [ -n "$(git status --porcelain -- data/marketstate data/sectors data/lab)" ]; then
            [ -n "$RUN_DATE" ] || { echo "::error::routine did not report its run date"; exit 1; }
            bun run typecheck && bun test src || checks_ok=false
            paths="data"
            msg="feat(routine): marketstate + sectors + lab snapshot $RUN_DATE (fallback)"
          else
            paths="data/setups/*.json"
            msg="chore(routine): setups pulse $(date -u +%FT%TZ)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          if git diff --cached --quiet; then
            echo "nothing to commit under $paths"
            exit 0
          fi
          git commit -m "$msg"
          if [ "$checks_ok" != "true" ]; then
            git push --force origin "HEAD:refs/heads/routine/$RUN_DATE"
            echo "::error::typecheck or tests failed on the daily data; pushed to routine/$RUN_DATE instead of the default branch"
            exit 1
          fi
          if ! git push; then
            echo "push rejected; rebasing once"
            git pull --rebase
            git push
          fi
