name: Extremes calibrate

# Weekly frequency calibration of the extremes detectors (docs/EXTREMES.md § Calibration pipeline):
# `bun run extremes calibrate --apply --json` replays stored scan_snapshots, tunes one multiplier per
# kind toward the target rate (forward returns never enter the objective) and stores the run in
# extreme_calibrations. The live job reads the latest applied row. One info push (ntfy) when an
# applied run changed a threshold. Without DATABASE_URL it prints a notice and exits 0.

on:
  schedule:
    - cron: "17 3 * * 0" # Sunday 03:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the proposal when a kind changes (false: store it as a proposal only)"
        type: boolean
        default: true
      days:
        description: "Days of steps to replay (history before them is read for the detectors' lookback)"
        type: string
        default: "30"

concurrency:
  group: extremes-calibrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL_MAX: "2"
      # Optional push channel for the one "Extremes recalibrated" alert; unset = no push.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - name: Check DATABASE_URL
        id: db
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; skipping the extremes calibration."
          else
            echo "set=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.set == '1'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        if: steps.db.outputs.set == '1'

      - name: Install
        if: steps.db.outputs.set == '1'
        run: bun install --frozen-lockfile

      - name: Calibrate
        if: steps.db.outputs.set == '1'
        env:
          # Scheduled runs apply; a manual run follows its inputs.
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
          DAYS: ${{ inputs.days || '30' }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "::error::days must be a positive integer"; exit 1 ;; esac
          flag=""
          if [ "$APPLY" = "true" ]; then flag="--apply"; fi
          bun scripts/extremes.ts calibrate --days "$DAYS" $flag --json > calibration.json
          jq -r .markdown calibration.json | tee -a "$GITHUB_STEP_SUMMARY"
